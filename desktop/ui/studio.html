<script>
  // Theme before first paint, so a dark window never flashes white.
  try {
    const t = localStorage.getItem('ahoos.theme') || 'system';
    const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const l = localStorage.getItem('ahoos.lang');
    if (l === 'en') { document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr'; }
  } catch (e) {}
</script>
